<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily News</title>
  <meta name="description" content="A daily digest of the stories that matter, refreshed every morning." />
  <style>
    :root {
      --bg: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f4f4f2;
      --border: #e6e6e2;
      --text: #1a1a18;
      --muted: #6b6b66;
      --accent: #2f6f4f;
      --accent-soft: #e7f1eb;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
      --radius: 14px;
    }
    :root[data-theme="dark"] {
      --bg: #0e0f0e;
      --surface: #171917;
      --surface-2: #1f221f;
      --border: #2a2d2a;
      --text: #ececec;
      --muted: #9a9a94;
      --accent: #6fce9f;
      --accent-soft: #16241d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0f0e; --surface: #171917; --surface-2: #1f221f; --border: #2a2d2a;
        --text: #ececec; --muted: #9a9a94; --accent: #6fce9f; --accent-soft: #16241d;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }

    header.site {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: saturate(1.4) blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .bar { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
    .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
    .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; font-weight: 700; }
    .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; margin-bottom: 2px; }
    .brand .tag { color: var(--muted); font-size: 12.5px; }
    select, button.ghost {
      font: inherit; font-size: 13.5px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 11px; cursor: pointer;
    }
    select:hover, button.ghost:hover { border-color: var(--accent); }
    button.icon {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; width: 36px; height: 34px; cursor: pointer; font-size: 15px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    button.icon:hover { border-color: var(--accent); }

    .edition-head { padding: 30px 0 10px; }
    .kicker { color: var(--accent); font-weight: 600; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
    .edition-head h2 { margin: 6px 0 4px; font-size: 30px; letter-spacing: -.02em; line-height: 1.15; }
    .edition-head .meta { color: var(--muted); font-size: 14px; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 6px; }
    .chip {
      font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      cursor: pointer; white-space: nowrap;
    }
    .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .stories { display: grid; gap: 16px; padding: 16px 0 8px; }
    article.card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow);
      transition: transform .12s ease, border-color .12s ease;
    }
    article.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
    .cat { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; }
    .src { font-size: 12.5px; color: var(--muted); }
    .card h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.3; letter-spacing: -.01em; }
    .card h3 a { text-decoration: none; }
    .card h3 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .card p { margin: 0 0 12px; color: color-mix(in srgb, var(--text) 82%, var(--muted)); font-size: 15px; }
    .card .readmore { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .card .readmore:hover { text-decoration: underline; text-underline-offset: 2px; }

    .state { padding: 60px 0; text-align: center; color: var(--muted); }
    .state.err { color: #c0392b; }

    footer.site { border-top: 1px solid var(--border); margin-top: 40px; padding: 22px 0 50px; color: var(--muted); font-size: 13px; }
    footer.site a { color: var(--accent); }
    .archive-note { margin-top: 6px; }

    @media (max-width: 560px) {
      .edition-head h2 { font-size: 25px; }
      .brand .tag { display: none; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap bar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Daily News</h1>
        <span class="tag" id="builtTag"></span>
      </div>
      <button class="icon" id="prevBtn" title="Older edition" aria-label="Older edition">‹</button>
      <select id="editionSel" aria-label="Choose edition"></select>
      <button class="icon" id="nextBtn" title="Newer edition" aria-label="Newer edition">›</button>
      <button class="icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main class="wrap">
    <div class="edition-head">
      <div class="kicker" id="kicker">Latest edition</div>
      <h2 id="editionTitle">Loading…</h2>
      <div class="meta" id="editionMeta"></div>
    </div>
    <div class="filters" id="filters"></div>
    <section class="stories" id="stories">
      <div class="state" id="state">Loading the newsroom…</div>
    </section>
  </main>

  <footer class="site wrap">
    <div id="mdLink"></div>
    <div class="archive-note">Generated automatically each morning · <span id="edCount"></span></div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { manifest: null, edition: null, activeCat: null };

    // ---- Theme ----
    const themeBtn = $("themeBtn");
    function applyTheme(t) {
      if (t) document.documentElement.setAttribute("data-theme", t);
      else document.documentElement.removeAttribute("data-theme");
    }
    applyTheme(localStorage.getItem("news-theme"));
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const isDark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
      const next = isDark ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem("news-theme", next);
    });

    // ---- Helpers ----
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function fmtDate(d) {
      const dt = new Date(d + "T00:00:00");
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }
    function fmtPublished(p) {
      if (!p) return "";
      const dt = new Date(p);
      if (isNaN(dt)) return String(p);
      return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    // ---- Rendering ----
    function renderFilters() {
      const cats = [...new Set(state.edition.stories.map((s) => s.category).filter(Boolean))];
      const box = $("filters");
      if (cats.length <= 1) { box.innerHTML = ""; return; }
      const mk = (label, val) =>
        `<button class="chip" role="button" aria-pressed="${state.activeCat === val}" data-cat="${esc(val ?? "")}">${esc(label)}</button>`;
      box.innerHTML = mk("All", null) + cats.map((c) => mk(c, c)).join("");
      box.querySelectorAll(".chip").forEach((el) =>
        el.addEventListener("click", () => {
          const v = el.dataset.cat;
          state.activeCat = v === "" ? null : v;
          renderFilters();
          renderStories();
        }));
    }

    function renderStories() {
      const list = state.edition.stories.filter(
        (s) => !state.activeCat || s.category === state.activeCat);
      $("stories").innerHTML = list.map((s) => `
        <article class="card">
          <div class="top">
            ${s.category ? `<span class="cat">${esc(s.category)}</span>` : ""}
            <span class="src">${esc(s.source || "")}${s.published ? " · " + esc(fmtPublished(s.published)) : ""}</span>
          </div>
          <h3>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>` : esc(s.title)}</h3>
          <p>${esc(s.summary || "")}</p>
          ${s.url ? `<a class="readmore" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Read the source →</a>` : ""}
        </article>`).join("") ||
        `<div class="state">No stories in this category.</div>`;
    }

    function renderEdition(ed, meta) {
      state.edition = ed;
      state.activeCat = null;
      $("editionTitle").textContent = "Daily News — " + fmtDate(ed.date);
      const genTime = ed.generated_at ? new Date(ed.generated_at) : null;
      $("editionMeta").textContent =
        `${ed.stories.length} stor${ed.stories.length === 1 ? "y" : "ies"}` +
        (genTime && !isNaN(genTime) ? " · compiled " + genTime.toLocaleString() : "");
      $("kicker").textContent = state.manifest.latest === ed.date ? "Latest edition" : "From the archive";
      $("mdLink").innerHTML = meta && meta.md
        ? `Prefer plain text? <a href="${esc(meta.md)}" target="_blank" rel="noopener">Read the Markdown edition →</a>` : "";
      renderFilters();
      renderStories();
    }

    async function loadEdition(date) {
      const meta = state.manifest.editions.find((e) => e.date === date);
      if (!meta) return;
      $("stories").innerHTML = `<div class="state">Loading ${esc(date)}…</div>`;
      try {
        const res = await fetch(meta.file, { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        $("editionSel").value = date;
        history.replaceState(null, "", "#" + date);
        renderEdition(data, meta);
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        $("stories").innerHTML = `<div class="state err">Could not load ${esc(date)} — ${esc(err.message)}</div>`;
      }
      updateNav(date);
    }

    function updateNav(date) {
      const eds = state.manifest.editions;
      const i = eds.findIndex((e) => e.date === date);
      $("prevBtn").disabled = i >= eds.length - 1;
      $("nextBtn").disabled = i <= 0;
      $("prevBtn").style.opacity = $("prevBtn").disabled ? .35 : 1;
      $("nextBtn").style.opacity = $("nextBtn").disabled ? .35 : 1;
    }

    function step(dir) {
      const eds = state.manifest.editions;
      const i = eds.findIndex((e) => e.date === state.edition.date);
      const j = i + dir; // +1 = older (list is newest-first), -1 = newer
      if (j >= 0 && j < eds.length) loadEdition(eds[j].date);
    }

    async function init() {
      try {
        const res = await fetch("manifest.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.manifest = await res.json();
      } catch (err) {
        $("stories").innerHTML = `<div class="state err">Couldn't load the news index (manifest.json). ${esc(err.message)}</div>`;
        $("editionTitle").textContent = "Unavailable";
        return;
      }
      const eds = state.manifest.editions || [];
      $("builtTag").textContent = eds.length ? "updated " + (state.manifest.latest || "") : "";
      $("edCount").textContent = eds.length + " edition" + (eds.length === 1 ? "" : "s") + " archived";
      $("editionSel").innerHTML = eds
        .map((e) => `<option value="${esc(e.date)}">${esc(fmtDate(e.date))}</option>`).join("");
      $("editionSel").addEventListener("change", (e) => loadEdition(e.target.value));
      $("prevBtn").addEventListener("click", () => step(1));
      $("nextBtn").addEventListener("click", () => step(-1));

      const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
      const start = eds.find((e) => e.date === hash) ? hash : state.manifest.latest;
      if (start) loadEdition(start);
      else $("stories").innerHTML = `<div class="state">No editions yet.</div>`;
    }

    init();
  </script>
</body>
</html>
